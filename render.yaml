# Render Blueprint: lets Render auto-create the web service when you connect
# the GitHub repo. Deploy and it becomes live automatically.
services:
  - type: web
    name: rural-health-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true